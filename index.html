<body>
    <div class="container">
        <div class="search-box">
            <input id="city-input" type="text" placeholder="Enter City Name">
            <button id="search-button">Search</button>
            <style>
                * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #74ebd5, #9face6);
}

.container {
    width: 350px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 16px;
}

input:focus {
    border-color: #4a90e2;
}

button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    background: #357abd;
}

.weather-info {
    text-align: center;
}

.weather-info h3 {
    font-size: 26px;
    margin-bottom: 10px;
}

.weather-info h6 {
    color: #666;
    margin-bottom: 15px;
    font-size: 14px;
}

.weather-info p {
    font-size: 22px;
    font-weight: bold;
    color: #4a90e2;
}
            </style>
        </div>

        <div class="weather-info">
            <h3 id="city-name"></h3>
            <h6 id="city-time"></h6>
            <p id="city-temp"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
